<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>staHR</title>
    <!-- App logo and favicon (served from public/assets/logo3.png) -->
    <link rel="icon" type="image/png" href="/assets/logo3.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/assets/logo3.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/assets/logo3.png" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Preserve Supabase auth fragments across SPA bootstrap.
      // If the email recovery link includes tokens in the URL hash,
      // stash them in sessionStorage so the client app can restore
      // the session after the framework initializes. Also record
      // whether this is an invite (set-password) or recovery (reset)
      (function() {
        try {
          const rawHash = window.location.hash || ''
          if (rawHash && rawHash.indexOf('access_token=') !== -1) {
            const clean = rawHash.replace(/^#/, '')
            try { sessionStorage.setItem('supabase_auth_hash', clean) } catch (e) {}

            // detect type from hash params
            try {
              const params = new URLSearchParams(clean)
              const type = params.get('type') || ''
              const tokenType = type === 'invite' ? 'set-password' : 'reset'
              try { sessionStorage.setItem('supabase_recovery', tokenType) } catch (e) {}

              // Redirect user to the appropriate recovery route (removes tokens from visible URL)
              const base = window.location.origin || ''
              const recoveryPath = tokenType === 'set-password' ? '/set-password' : '/reset'
              window.history.replaceState({}, '', base + recoveryPath + '?recovery=1')
            } catch (e) {
              // fallback to /reset
              try { sessionStorage.setItem('supabase_recovery', 'reset') } catch (e) {}
              const base = window.location.origin || ''
              window.history.replaceState({}, '', base + '/reset?recovery=1')
            }
          }
        } catch (e) {
          console.error('pre-bootstrap hash stash failed', e)
        }
      })()
    </script>
  </head>
