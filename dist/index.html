  <body>
    <div id="root"></div>
    <script>
      // Preserve Supabase auth fragments across SPA bootstrap.
      // If the email recovery link includes tokens in the URL hash,
      // stash them in sessionStorage so the client app can restore
      // the session after the framework initializes.
      (function() {
        try {
          const h = window.location.hash || ''
          if (h && h.indexOf('access_token=') !== -1) {
            sessionStorage.setItem('supabase_auth_hash', h.replace(/^#/, ''))
            // Redirect user to the reset route (removes tokens from visible URL)
            const base = window.location.origin || ''
            const resetPath = '/reset?recovery=1'
            window.history.replaceState({}, '', base + resetPath)
          }
        } catch (e) {
          console.error('pre-bootstrap hash stash failed', e)
        }
      })()
    </script>
  </body>
