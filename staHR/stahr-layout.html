<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>staHR — Sample Layout</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F6F1;
    --paper-raised:#FFFFFF;
    --ink:#1C2B33;
    --ink-soft:#5B6B72;
    --line:#DBDCD4;
    --line-strong:#C3C5BA;
    --brass:#A8763E;
    --brass-dark:#8C6130;
    --status-selected:#2F7D5A;
    --status-selected-bg:#E6F0EA;
    --status-rejected:#B33F3F;
    --status-rejected-bg:#F5E8E8;
    --status-hold:#B8873A;
    --status-hold-bg:#F4EDE1;
    --status-progress:#3E6FA8;
    --status-progress-bg:#E7EDF4;
    --status-dropped:#7A7A72;
    --status-dropped-bg:#EDEDE9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px;
    flex-shrink:0;
    background:var(--ink);
    color:#EDEEE9;
    padding:28px 0;
    display:flex;
    flex-direction:column;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    padding:0 24px 24px;
    letter-spacing:0.01em;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:18px;
  }
  .brand span{color:var(--brass); font-style:italic; font-weight:500;}
  .nav-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:rgba(237,238,233,0.45);
    padding:0 24px;
    margin-bottom:8px;
  }
  .role-tab{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 24px;
    cursor:pointer;
    color:rgba(237,238,233,0.8);
    border-left:3px solid transparent;
    font-size:13.5px;
  }
  .role-tab:hover{background:rgba(255,255,255,0.05);}
  .role-tab.active{
    background:rgba(255,255,255,0.08);
    border-left-color:var(--brass);
    color:#fff;
    font-weight:500;
  }
  .role-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:rgba(255,255,255,0.12);
    padding:1px 7px;
    border-radius:10px;
  }
  .sidebar-footer{
    margin-top:auto;
    padding:16px 24px 0;
    border-top:1px solid rgba(255,255,255,0.12);
    font-size:11.5px;
    color:rgba(237,238,233,0.4);
    line-height:1.5;
  }

  /* ---------- Main ---------- */
  .main{flex:1; padding:28px 36px 60px; min-width:0;}
  .topbar{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:22px;
  }
  .topbar h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 4px;
  }
  .topbar p{margin:0; color:var(--ink-soft); font-size:13px;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px; font-weight:600;
    border:none; border-radius:6px;
    padding:10px 18px;
    cursor:pointer;
  }
  .btn-primary{background:var(--brass); color:#fff;}
  .btn-primary:hover{background:var(--brass-dark);}
  .btn-ghost{background:transparent; border:1px solid var(--line-strong); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .btn-danger{background:transparent; color:var(--status-rejected); border:1px solid var(--status-rejected);}
  .btn-danger:hover{background:var(--status-rejected-bg);}

  /* stat strip */
  .stats{display:flex; gap:12px; margin-bottom:22px;}
  .stat-card{
    flex:1;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
  }
  .stat-card .num{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:500;}
  .stat-card .label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}
  .stat-card.selected .num{color:var(--status-selected);}
  .stat-card.rejected .num{color:var(--status-rejected);}
  .stat-card.hold .num{color:var(--status-hold);}
  .stat-card.progress .num{color:var(--status-progress);}

  /* toolbar */
  .toolbar{
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .search-box{
    flex:1; max-width:320px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-raised);
    border:1px solid var(--line-strong);
    border-radius:6px;
    padding:8px 12px;
  }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-size:13px; width:100%; font-family:'Inter',sans-serif;
  }
  select.filter{
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }

  /* table */
  .table-wrap{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    font-weight:600;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
  }
  thead th:hover{color:var(--ink);}
  tbody td{
    padding:13px 14px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
    font-size:13px;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAF6; cursor:pointer;}
  .cand-name{font-weight:600;}
  .cand-sub{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .mono{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .pipeline{display:flex; gap:4px; margin-top:6px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--line-strong);}
  .dot.on{background:var(--brass);}
  .badge{
    display:inline-block;
    font-size:11px; font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.selected{background:var(--status-selected-bg); color:var(--status-selected);}
  .badge.rejected{background:var(--status-rejected-bg); color:var(--status-rejected);}
  .badge.hold{background:var(--status-hold-bg); color:var(--status-hold);}
  .badge.progress{background:var(--status-progress-bg); color:var(--status-progress);}
  .badge.dropped{background:var(--status-dropped-bg); color:var(--status-dropped);}
  .row-actions{display:flex; gap:6px; opacity:0; transition:opacity .1s;}
  tbody tr:hover .row-actions{opacity:1;}
  .icon-btn{
    border:1px solid var(--line-strong); background:#fff; border-radius:5px;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:12px; color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--ink); color:var(--ink);}
  .icon-btn.del:hover{border-color:var(--status-rejected); color:var(--status-rejected);}

  .empty{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .empty .big{font-family:'Fraunces',serif; font-size:18px; color:var(--ink); margin-bottom:6px;}

  /* ---------- Drawer / Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(28,43,51,0.35);
    display:none; z-index:40;
  }
  .overlay.open{display:block;}
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:460px;
    background:var(--paper-raised);
    box-shadow:-8px 0 30px rgba(0,0,0,0.12);
    z-index:50;
    transform:translateX(100%);
    transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:22px 26px 16px;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .drawer-head h2{
    font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin:0;
  }
  .drawer-head .sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .drawer-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;}
  .drawer-body{padding:20px 26px; overflow-y:auto; flex:1;}
  .field-row{display:flex; gap:12px; margin-bottom:14px;}
  .field{flex:1; margin-bottom:14px;}
  .field-row .field{margin-bottom:0;}
  .field label{
    display:block; font-size:11px; font-weight:600; text-transform:uppercase;
    letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line-strong); border-radius:6px;
    padding:9px 11px; font-size:13px; font-family:'Inter',sans-serif; color:var(--ink);
    background:#fff;
  }
  .field textarea{resize:vertical; min-height:52px; font-family:'Inter',sans-serif;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--brass); outline-offset:0; border-color:var(--brass);}
  .drawer-foot{
    padding:16px 26px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; gap:10px;
  }
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);}

  @media (max-width:880px){
    .sidebar{display:none;}
    .main{padding:20px;}
    .drawer{width:100%;}
  }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">staHR</div>
    <div class="nav-label">Roles</div>
    <div id="roleTabs"></div>
    <div class="sidebar-footer">
      Sample layout only — demonstrates Create, Read, Update, Delete against in‑memory data. Not connected to a backend.
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">HR Generalist</h1>
        <p id="pageSub">Candidate submissions and interview pipeline</p>
      </div>
      <button class="btn btn-primary" onclick="openDrawer()">+ Add Candidate</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <div class="search-box">
        <span>🔍</span>
        <input id="searchInput" placeholder="Search name, email, location…" oninput="render()">
      </div>
      <select class="filter" id="statusFilter" onchange="render()">
        <option value="">All statuses</option>
        <option value="selected">Selected</option>
        <option value="progress">In progress</option>
        <option value="hold">On hold</option>
        <option value="rejected">Rejected</option>
        <option value="dropped">Dropped out</option>
      </select>
      <select class="filter" id="sortField" onchange="render()">
        <option value="date_desc">Newest submission</option>
        <option value="date_asc">Oldest submission</option>
        <option value="name_asc">Name A–Z</option>
        <option value="exp_desc">Experience (high–low)</option>
      </select>
    </div>

    <div class="table-wrap" id="tableWrap"></div>

  </div>
  
</div>

<script>
  // minimal inline script to make the sample layout interactive when opened standalone
  function render(){ /* no-op for sample */ }
  function openDrawer(){}
</script>

</body>
</html>
